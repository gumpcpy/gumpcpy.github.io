<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var k = "catalogue-theme";
          var s = localStorage.getItem(k);
          var theme =
            s === "light" || s === "dark"
              ? s
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=20260929e" />
    <title>Py Chen — Profile</title>
    <meta name="description" content="Py Chen — experience, talks, certifications, patents, contact." />
  </head>
  <body data-page="profile">
    <div class="sky" aria-hidden="true"></div>

        <nav class="nav" aria-label="Primary">
      <a class="nav-home" href="/" aria-label="Home">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 3.2 3.8 10.2c-.3.3-.4.6-.4 1V20c0 .6.4 1 1 1h5.2v-5.4h5v5.4H19.6c.6 0 1-.4 1-1v-8.8c0-.4-.1-.7-.4-1L12 3.2z"/>
        </svg>
      </a>
      <div class="nav-desktop" id="nav-desktop"></div>
      <div class="nav-end">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="zh" aria-pressed="true">中文</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="nav-burger" id="nav-toggle" aria-expanded="false" aria-controls="mobile-menu" aria-label="選單">
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>
    <div id="mega-panel" class="mega-panel" hidden></div>
    <div id="mobile-menu" class="mobile-sheet" hidden></div>

    <header class="page-hero" id="top">
      <p class="eyebrow" id="eyebrow">Profile</p>
      <h1 class="brand" id="page-title">Profile</h1>
      <p class="lede" id="page-lead"></p>
    </header>

    <section class="section profile-block" id="experience">
      <h2 class="profile-section-title">Experience</h2>
      <p class="section-lead"></p>
      <div class="profile-section-body" aria-live="polite"></div>
    </section>

    <section class="section profile-block" id="talks">
      <h2 class="profile-section-title">Talks</h2>
      <p class="section-lead"></p>
      <div class="profile-section-body" aria-live="polite"></div>
    </section>

    <section class="section profile-block learning" id="certifications">
      <h2 class="profile-section-title">證明</h2>
      <p class="section-lead" id="cert-lead"></p>
      <button
        type="button"
        class="btn ghost learning-toggle"
        id="cert-toggle"
        aria-expanded="false"
        aria-controls="cert-list"
      >
        展開證書
      </button>
      <div class="cert-list" id="cert-list" hidden></div>
    </section>

    <section class="section profile-block" id="contact">
      <h2 class="profile-section-title">Contact</h2>
      <p class="section-lead"></p>
      <div class="profile-section-body"></div>
    </section>

    <footer class="footer">
      <p class="brand-sm" id="footer-brand">Py Chen</p>
      <p id="footer-note">個人網站 · 系統、案例與檔案</p>
      <p class="footer-contact">
        <span class="footer-contact-label" id="footer-contact-label">聯繫方式：</span>
        <a href="mailto:gumpcpy@gmail.com">gumpcpy@gmail.com</a>
      </p>
      <p class="footer-updated" id="footer-updated"></p>
    </footer>

    <a class="back-to-top" id="back-to-top" href="#top" aria-label="回到頂部" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M12 5.5 5.5 12l1.4 1.4L11 9.3V19h2V9.3l4.1 4.1L18.5 12 12 5.5z" />
      </svg>
    </a>

    <script src="/js/profile.js?v=20260929e" type="module"></script>
  </body>
</html>
